# ===== VELOCITY - Yazi Config =====
# Theme: Catppuccin Mocha × Hollow Knight

[manager]
ratio          = [1, 2, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true
linemode       = "size"

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "lanczos3"
image_quality   = 75

[opener]
edit = [
    { run = 'code "$@"', desc = "VS Code", orphan = true },
]
open = [
    { run = 'zen-browser "$@"', desc = "Zen Browser", orphan = true },
]
play = [
    { run = 'mpv "$@"', orphan = true, desc = "mpv" },
]
extract = [
    { run = 'unar "$@"', desc = "Extract here" },
]

[open]
rules = [
    { mime = "text/*",           use = "edit"    },
    { mime = "image/*",          use = "open"    },
    { mime = "video/*",          use = "play"    },
    { mime = "audio/*",          use = "play"    },
    { mime = "application/zip",  use = "extract" },
    { mime = "application/tar",  use = "extract" },
    { mime = "application/pdf",  use = "open"    },
    { name = "*.py",             use = "edit"    },
    { name = "*.js",             use = "edit"    },
    { name = "*.ts",             use = "edit"    },
    { name = "*.cpp",            use = "edit"    },
    { name = "*.java",           use = "edit"    },
    { name = "*.md",             use = "edit"    },
    { name = "*.json",           use = "edit"    },
    { name = "*.toml",           use = "edit"    },
    { name = "*.yaml",           use = "edit"    },
    { name = "*.yml",            use = "edit"    },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912
image_bound      = [0, 0]
suppress_preload = false

[input]
cursor_blink = false

[log]
enabled = false
