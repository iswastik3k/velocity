# ===== VELOCITY - Kitty Config =====
# Theme: Catppuccin Mocha × Hollow Knight

# === INCLUDE CATPPUCCIN ===
# === CUURENT THEME = CATPPUCCIN MOCHA ===
include current-theme.conf

# === FONT ===
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# === CURSOR ===
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
# lavender — ties cursor to the border accent
cursor                #b4befe
cursor_text_color     #1e1e2e

# === WINDOW ===
background_opacity    0.88
dynamic_background_opacity yes

# padding — enough to breathe, not excessive
window_padding_width  10 14

# no titlebar, clean edge
hide_window_decorations yes

# === SCROLLBACK ===
scrollback_lines 5000

# === PERFORMANCE ===
repaint_delay    2
input_delay      1
sync_to_monitor  yes

# === BELL ===
enable_audio_bell no

# === TAB BAR ===
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_background     #1e1e2e
tab_active_foreground  #b4befe
tab_inactive_foreground #6c7086
