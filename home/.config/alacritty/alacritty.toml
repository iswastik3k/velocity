# ===== VELOCITY - Alacritty Config =====
# Theme: Rosé Pine Moon (Mocha-like Dark) × Hollow Knight

# === FONT ===
[font]
size = 11.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

# === CURSOR ===
[cursor]
style = { shape = "Beam", blinking = "Never" }
thickness = 0.15

# === WINDOW ===
[window]
opacity = 0.80
padding = { x = 14, y = 10 }
decorations = "none"
dynamic_padding = true

# === SCROLLBACK ===
[scrolling]
history = 5000

[colors.primary]
background = "#232136"
foreground = "#e0def4"

[colors.cursor]
text   = "#232136"
cursor = "#ea9a97"

[colors.selection]
text       = "#e0def4"
background = "#393552"

[colors.normal]
black   = "#393552"
red     = "#eb6f92"
green   = "#3e8fb0"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ea9a97"
white   = "#e0def4"

[colors.bright]
black   = "#6e6a86"
red     = "#eb6f92"
green   = "#3e8fb0"
yellow  = "#f6c177"
blue    = "#9ccfd8"
magenta = "#c4a7e7"
cyan    = "#ea9a97"
white   = "#e0def4"
