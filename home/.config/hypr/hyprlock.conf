background {
    monitor =
    path = ~/Wallpapers/hollow-knight.jpg
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.15
    vibrancy_darkness = 0.4
}

general {
    grace = 2
    hide_cursor = true
    no_fade_in = false
    no_fade_out = true
    disable_loading_bar = true
}

# === DATE ===
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(205, 214, 244, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# === TIME ===
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(180, 190, 254, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

# === PASSWORD INPUT ===
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(180, 190, 254, 0.3)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgba(205, 214, 244, 1.0)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    hide_input = false
    rounding = 10
    check_color = rgba(180, 190, 254, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    fail_text =
    capslock_color = rgba(249, 226, 175, 1.0)
    position = 0, -60
    halign = center
    valign = center
}

# === SUBTLE HINT ===
label {
    monitor =
    text =     
    color = rgba(108, 112, 134, 0.6)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
}
