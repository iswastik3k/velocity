background {
    monitor =
    path = ~/Wallpapers/horizon-2.jpg
    blur_passes = 5
    blur_size = 10
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.2
    vibrancy_darkness = 0.5
}

general {
    hide_cursor = true
}

# === DATE ===
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(224, 222, 244, 0.8)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# === TIME ===
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(234, 154, 151, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

# === PASSWORD INPUT ===
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(234, 154, 151, 0.3)
    inner_color = rgba(35, 33, 54, 0.8)
    font_color = rgba(224, 222, 244, 1.0)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    hide_input = false
    rounding = 12
    check_color = rgba(196, 167, 231, 1.0)
    fail_color = rgba(235, 111, 146, 1.0)
    fail_text =
    capslock_color = rgba(246, 193, 119, 1.0)
    position = 0, -60
    halign = center
    valign = center
}
